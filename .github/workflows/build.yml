name: Build Clasher Events
on:
  push:
    branches: [main, development, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and verify plugin
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Validate YAML resources
        run: |
          ruby -e 'require "yaml"; Dir.glob("src/main/resources/**/*.yml").sort.each { |file| YAML.load_file(file); puts "Valid YAML: #{file}" }'
      - name: Verify packaged plugin
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find target -maxdepth 1 -type f -name 'clasher-events-*.jar' ! -name 'original-*' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -Fxq 'plugin.yml'
          jar tf "$JAR" | grep -Fxq 'network/clasher/events/ClasherEventsPlugin.class'
          unzip -p "$JAR" plugin.yml | grep -Fq 'main: network.clasher.events.ClasherEventsPlugin'
          echo "Verified packaged plugin: $JAR"
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: clasher-events
          path: target/clasher-events-*.jar
