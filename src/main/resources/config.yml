# ==============================================================================
# Clasher Events v2.7.3 Configuration
# ==============================================================================
# Zero-dependency plug-and-play PvP tournament & events engine.
# WorldEdit, WorldGuard, Hologram plugins, and PlaceholderAPI are 100% optional!
# Reload live with /ce reload.
# ==============================================================================

branding:
  server-ip: play.clashernetwork.fun

# Lock custom-decorated builds so /ce setup & /ce setup refresh NEVER overwrite them!
# Toggle in-game via: /ce setup lock <tournament-lobby|lobby|winner-podium|arena>
setup:
  locked-structures: []

shared-world: clasher_events
use-void-world: true

# true  = Dedicated Event Server (returns players to configured event lobby)
# false = Single-Server SMP (returns players to their exact pre-event survival location)
dedicated-server-mode: true

default-registration-seconds: 120
kit-delivery-seconds-before-start: 60
disconnect-grace-seconds: 60
celebration-seconds: 6

# Smart registration sizing (speeds up countdown when full!).
registration:
  min-players: 2
  max-players: 32
  fast-start-seconds: 10

# Audience points awarded to spectators who correctly predict the event winner.
audience-correct-prediction-points: 10

# Automatic arena pasting (no WorldEdit required!) & post-match zero-lag block rollback.
arenas:
  auto-paste-on-first-use: true
  auto-reset-after-match: true
  paste-blocks-per-tick: 2500
  rollback-blocks-per-tick: 300

# Live HUD (Adventure BossBar, Flicker-Free Scoreboard, Below-Name HP, Tablist, Hit ActionBar, Titles).
hud:
  bossbar: true
  scoreboard: true
  below-name-health: true
  tablist: true
  hit-actionbar: true
  titles: true

# Native Paper 3D TextDisplay Floating Holograms in Lobby & Winner Podium (zero external plugin needed!).
holograms:
  enabled: true

# Pre-event mode voting (/ce voteopen & /event modevote).
mode-vote:
  duration-seconds: 45
  options:
    - nethpot
    - crystal
    - crystal-ffa
    - build-uhc
    - sword
    - axe-shield
    - diamond-pot
    - team-wars
    - tournament

# Strict command whitelist while a player is participating in an event (blocks /ec, /ah, /home, /spawn, etc.).
security:
  block-disallowed-commands: true
  block-containers-during-event: true
  allowed-commands-during-event:
    - event
    - ce
    - msg
    - r
    - reply
    - tell
    - w
    - help

# AFK elimination rules during live combat.
afk:
  enabled: true
  eliminate-after-seconds: 300

# Per-player world borders (centered automatically on arena bounds, with REAL damage & dynamic player-scaled shrink!).
world-border:
  dynamic-shrink: true
  dynamic-shrink-seconds: 25
  damage-per-second: 2.0
  wave1:
    size: 84
    shrink-seconds: 60
  wave2:
    size: 52
    shrink-seconds: 60
  final:
    size: 26
    shrink-seconds: 30

# Player-initiated casual 1v1 duels (/event duel <player>) with automatic Admin Event Priority Override!
# Automatically runs in the 8 dedicated 1v1 Duel Arenas (duel-*), leaving the main grand arenas untouched!
casual-duels:
  enabled: true
  request-expire-seconds: 60

# Esports Team Tournaments (1v1 / 2v2 / 3v3 / 4v4) with dedicated Grand Tournament Hall,
# timed teammate invites, auto-fill for solo players, optional Best-of-3 Grand Finals & Parallel Early Rounds!
tournament:
  default-team-size: 2
  auto-fill-solos: true
  bo3-finals: true
  parallel-rounds: false
  invite-expire-seconds: 60

# Anti-Stall Sudden Death & Damage Tie-Breaker for 1v1 Duels, Party Duels, & Tournament Matches!
sudden-death:
  enabled: true
  duel-seconds: 180
  tournament-match-seconds: 180
  tiebreak-after-seconds: 60
  border-size: 12

# Always-Open Warmup FFA Pits (/event ffa -> Sword FFA or Deep-Ground Crystal Terrain FFA with Auto-Reset!)
warmup-ffa:
  enabled: true
  arena: sword
  kit: sword
  crystal-arena: crystal-ffa
  crystal-kit: crystal
  auto-reset-seconds: 300

# Native Paper Clickable Lobby NPCs in the Imperial Sky Citadel Main Lobby (zero external plugin needed!).
lobby-npcs:
  enabled: true

# Optional automatic event hosting (set enabled: true to auto-run events without staff online).
auto-scheduler:
  enabled: false
  timezone: Asia/Kolkata
  min-online-players: 4
  interval-minutes: 60
  # Leave fixed-times empty to use interval-minutes, or specify 24h times like ["18:00", "21:00"]
  fixed-times: []
  use-mode-vote: true
  mode-rotation:
    - nethpot
    - sword
    - build-uhc
    - crystal
    - team-wars
    - tournament

# Optional Discord Webhook notifications (Event Open + Winner & MVP embed card).
discord:
  enabled: false
  webhook-url: ""

# Console commands executed when a winner is decided.
# Placeholders: {player}, {uuid}, {arena}, {mode}
rewards:
  winner:
    commands: []
  team-winner:
    commands: []

# Named locations — auto-configured by /ce setup, or customize in-game with /ce setlobby, /ce setspectator, /ce setwinner.
locations:
  lobby:
    world: clasher_events
    x: -399.5
    y: 102.0
    z: 0.5
    yaw: 180.0
    pitch: 0.0
  spectator:
    world: clasher_events
    x: -399.5
    y: 102.0
    z: 0.5
    yaw: 180.0
    pitch: 0.0
  winner:
    world: clasher_events
    x: -599.5
    y: 105.0
    z: -5.5
    yaw: 0.0
    pitch: 0.0
  winner-crowd:
    world: clasher_events
    x: -599.5
    y: 102.0
    z: 9.5
    yaw: 180.0
    pitch: 0.0
  tournament-lobby:
    world: clasher_events
    x: -799.5
    y: 102.0
    z: 0.5
    yaw: 180.0
    pitch: 0.0

lobby-protection:
  radius: 46
  catch-void-fall: true
  give-lobby-hotbar: true
  parkour-timer: true
  # Use each arena's built-in themed waiting skybox (or custom /ce setwaiting <arena>) during registration.
  # Set to false to always gather waiting players in the global Sky Citadel Lobby (locations.lobby).
  per-arena-waiting: true
  # In dedicated-server-mode, automatically send non-staff players to the Event Spawn Lobby when joining the server.
  teleport-on-server-join: true

# Multi-layer anti-escape containment (blocks ender pearls/chorus/towering/wall-breaking/spectator fly-away).
anti-escape:
  enabled: true

# Cinematic PvP effects (grace freeze, kill heal, bounties, final-duel glow, lightning, streaks, auto-respawn).
effects:
  grace-seconds: 3
  kill-heal: true
  kill-bounty: true
  final-duel-glow: true
  kill-lightning: true
  first-blood: true
  kill-streaks: true
  auto-respawn: true

rules-book:
  enabled: true
  pages:
    - "<gold><bold>CLASHER EVENTS</bold></gold>\n\n<black>Welcome! Read the rules before the match begins.</black>"
    - "<gold><bold>RULES</bold></gold>\n\n<black>1. No teaming in solo modes.\n2. No exploits or unfair modifications.\n3. Follow staff instructions.</black>"
    - "<gold><bold>MATCH INFO</bold></gold>\n\n<black>Your kit is delivered before combat starts. Eliminated players become spectators and can predict the winner with /event vote!</black>"

# Sound keys (supports both Minecraft keys like 'ui.button.click' and legacy names like 'UI_BUTTON_CLICK').
sounds:
  join: ui.button.click
  rules-book: item.book.page_turn
  kit: entity.item.pickup
  start: block.note_block.pling
  winner: ui.toast.challenge_complete
