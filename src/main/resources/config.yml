# ==============================================================================
# Clasher Events Configuration
# ==============================================================================
# All arena schematics are pasted into one shared world (one active event at a time).
# Reload live with /ce reload.
# ==============================================================================

shared-world: clasher_events

default-registration-seconds: 120
kit-delivery-seconds-before-start: 60
disconnect-grace-seconds: 60

# Audience points awarded to spectators who correctly predict the event winner.
audience-correct-prediction-points: 10

# AFK elimination rules during live combat.
afk:
  enabled: true
  eliminate-after-seconds: 300

# Per-player world borders used because all arenas share one world.
world-border:
  wave1:
    size: 140
    shrink-seconds: 60
  wave2:
    size: 80
    shrink-seconds: 60
  final:
    size: 35
    shrink-seconds: 30

# Console commands executed when a winner is decided.
# Placeholders: {player}, {uuid}, {arena}, {mode}
rewards:
  winner:
    commands: []
  team-winner:
    commands: []

# Named locations — configure in-game with /ce setlobby, /ce setspectator, /ce setwinner.
locations:
  lobby:
    world: clasher_events
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  spectator:
    world: clasher_events
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  winner:
    world: clasher_events
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

lobby-protection:
  radius: 35

rules-book:
  enabled: true
  pages:
    - "<gold><bold>CLASHER EVENTS</bold></gold>\n\n<black>Welcome! Read the rules before the match begins.</black>"
    - "<gold><bold>RULES</bold></gold>\n\n<black>1. No teaming in solo modes.\n2. No exploits or unfair modifications.\n3. Follow staff instructions.</black>"
    - "<gold><bold>MATCH INFO</bold></gold>\n\n<black>Your kit is delivered before combat starts. Eliminated players become spectators and can predict the winner with /event vote!</black>"

# Sound keys (supports both Minecraft keys like 'ui.button.click' and legacy names like 'UI_BUTTON_CLICK').
sounds:
  join: ui.button.click
  rules-book: item.book.page_turn
  kit: entity.item.pickup
  start: block.note_block.pling
  winner: ui.toast.challenge_complete
